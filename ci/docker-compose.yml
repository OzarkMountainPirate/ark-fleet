# Woodpecker CI — lints ark-fleet on push. Assumes a Traefik "proxy" network:
# joins the external `proxy` network, TLS via your wildcard cert (Option B
# tls.domains labels), reachable at https://${CI_HOST}. All values from ci/.env.
# Secrets are file-based in ci/.env (gitignored).
services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    environment:
      WOODPECKER_HOST: https://${CI_HOST}
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: ${CI_ADMIN_USER}
      WOODPECKER_REPO_OWNERS: ${CI_ADMIN_USER}
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    networks: [proxy, woodpecker]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.woodpecker.rule=Host(`${CI_HOST}`)
      - traefik.http.routers.woodpecker.entrypoints=websecure
      - traefik.http.routers.woodpecker.tls=true
      # match your actual DNS-01 resolver name if it isn't "cloudflare"
      - traefik.http.routers.woodpecker.tls.certresolver=cloudflare
      - traefik.http.routers.woodpecker.tls.domains[0].main=${CERT_DOMAIN}
      - traefik.http.routers.woodpecker.tls.domains[0].sans=*.${CERT_DOMAIN}
      - traefik.http.services.woodpecker.loadbalancer.server.port=8000

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    restart: unless-stopped
    command: agent
    depends_on: [woodpecker-server]
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
      WOODPECKER_MAX_WORKFLOWS: "2"
      WOODPECKER_BACKEND: docker
    volumes:
      # Direct socket for simplicity. To match your Tecnativa socket-proxy
      # posture instead, point WOODPECKER_SERVER's agent at a proxy exposing
      # CONTAINERS=1 IMAGES=1 POST=1 EXEC=1 (agent needs create/exec/wait).
      - /var/run/docker.sock:/var/run/docker.sock
      - woodpecker-agent-config:/etc/woodpecker
    networks: [woodpecker]

volumes:
  woodpecker-server-data:
  woodpecker-agent-config:

networks:
  proxy:
    external: true          # your existing Traefik network
  woodpecker:
    driver: bridge
