# Gitea Actions runner — executes ark-fleet's lint workflow on push.
# Config lives in .env (single source of truth). Registration is one-time;
# the token is consumed on first start and credentials persist in the volume.
services:
  act-runner:
    image: docker.io/gitea/act_runner:latest
    container_name: gitea-act-runner
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-ci-runner}
      # Maps the workflow's runs-on: ubuntu-latest to a real container image.
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest
    volumes:
      - runner-data:/data
      # Runner spawns job containers via the Docker API. To match your
      # socket-proxy posture instead, point DOCKER_HOST at a Tecnativa proxy
      # with CONTAINERS=1 IMAGES=1 POST=1 EXEC=1 INFO=1.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-data:
