#_preseed_V1
############################################################################
## ark-fleet :: unattended Debian 13 (trixie) install for the Lenovo Tinys.
##
## Produces a minimal, headless, SSH-ready box that Ansible can take over:
##   - admin user (from ADMIN_USER) in sudo (passwordless), SSH key, key-only auth
##   - openssh-server + python3 + sudo preinstalled (Ansible prerequisites)
##   - whole-disk auto-partition (UEFI), no desktop
##
## Hostname is NOT set here on purpose — one generic image, Ansible assigns
## acheron/cocytus from inventory. See bootstrap/README.md for how to boot it.
##
## SAFE TO PUBLISH: SSH password auth is disabled below, so the console
## password hash is break-glass only. Still, drop in a throwaway hash, not a
## reused one. Fill the two placeholder markers below (password hash + SSH key) first.
############################################################################

### Localization
d-i debian-installer/locale        string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — DHCP, generic hostname (Ansible renames per inventory)
d-i netcfg/choose_interface        select auto
d-i netcfg/get_hostname            string ark-tiny
d-i netcfg/get_domain              string __NET_DOMAIN__
d-i netcfg/hostname                string ark-tiny

### Mirror
d-i mirror/country                 string manual
d-i mirror/http/hostname           string deb.debian.org
d-i mirror/http/directory          string /debian
d-i mirror/http/proxy              string

### Clock / time
d-i clock-setup/utc                boolean true
d-i time/zone                      string __TIMEZONE__
d-i clock-setup/ntp                boolean true

### Accounts — root disabled so the first user gets sudo (Debian behavior)
d-i passwd/root-login              boolean false
d-i passwd/make-user               boolean true
d-i passwd/user-fullname           string __ADMIN_FULLNAME__
d-i passwd/username                string __ADMIN_USER__
# mkpasswd -m sha-512   (throwaway; SSH is key-only)
d-i passwd/user-password-crypted   password REPLACE_ME_SHA512_HASH
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home        boolean false

### Partitioning — pick the OS disk: prefer NVMe when multiple disks exist
### (e.g. NVMe system + HDD data disk), else first non-USB disk. Whole disk,
### UEFI ESP auto. Data disks are handled post-install by Ansible.
d-i partman/early_command string \
  DISK="$(list-devices disk | grep -v -e usb -e mmcblk | grep -m1 nvme)"; \
  [ -z "$DISK" ] && DISK="$(list-devices disk | grep -v -e usb -e mmcblk | head -n1)"; \
  debconf-set partman-auto/disk "$DISK"; \
  debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method            string regular
d-i partman-auto/choose_recipe     select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition       select finish
d-i partman/confirm                boolean true
d-i partman/confirm_nooverwrite    boolean true

### Base system + packages Ansible needs
d-i apt-setup/non-free-firmware    boolean true
d-i apt-setup/contrib              boolean true
tasksel tasksel/first              multiselect standard, ssh-server
d-i pkgsel/include                 string openssh-server sudo python3 python3-apt curl
d-i pkgsel/upgrade                 select full-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian     boolean true
d-i grub-installer/bootdev         string default

### Finish — no prompt, reboot into the installed system
d-i finish-install/reboot_in_progress note

### late_command: install SSH key, passwordless sudo, harden sshd
d-i preseed/late_command string \
  in-target mkdir -p /home/__ADMIN_USER__/.ssh; \
  echo 'REPLACE_ME_SSH_ED25519_PUBKEY' > /target/home/__ADMIN_USER__/.ssh/authorized_keys; \
  in-target chown -R __ADMIN_USER__:__ADMIN_USER__ /home/__ADMIN_USER__/.ssh; \
  in-target chmod 700 /home/__ADMIN_USER__/.ssh; \
  in-target chmod 600 /home/__ADMIN_USER__/.ssh/authorized_keys; \
  echo '__ADMIN_USER__ ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/90-__ADMIN_USER__; \
  in-target chmod 440 /etc/sudoers.d/90-__ADMIN_USER__; \
  printf 'PasswordAuthentication no\nPermitRootLogin no\n' > /target/etc/ssh/sshd_config.d/10-hardening.conf
