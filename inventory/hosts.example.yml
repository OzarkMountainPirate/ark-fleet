---
# COPY ME:  cp inventory/hosts.example.yml inventory/hosts.yml   (gitignored)
# Two game hosts. Rename freely; set your real ansible_host IPs.
# They form ONE ARK cluster (shared CLUSTER_ID + shared NFS cluster dir).
all:
  children:
    ark_fleet:
      hosts:
        acheron:                       # host #1
          ansible_host: 192.168.1.21
          ark_maps: [Ragnarok]         # names from ark_port_map; add/remove/
        cocytus:                       # swap here and re-run the play
          ansible_host: 192.168.1.22
          ark_maps: [Fjordur]
      vars:
        ansible_user: admin            # MUST match ADMIN_USER in netboot/.env
    nas:
      hosts:
        nas01:                         # TrueNAS box (datasets + NFS exports)
          ansible_host: 192.168.1.15
          ansible_user: root           # TrueNAS middleware access
