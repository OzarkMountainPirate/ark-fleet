[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
# NOTE: no vault_password_file here on purpose — referencing a file that does
# not exist breaks ansible-lint/CI and any fresh clone. Instead, per clone:
#   echo 'your-vault-password' > .vault_pass && chmod 600 .vault_pass
#   export ANSIBLE_VAULT_PASSWORD_FILE=$PWD/.vault_pass   (or use direnv)
# or pass --vault-password-file .vault_pass on the command line.

[privilege_escalation]
become        = True
become_method = sudo
