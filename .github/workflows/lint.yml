name: lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The pip 'ansible' bundle ships community.general and ansible.posix,
      # so no ansible-galaxy step — galaxy.ansible.com is a flaky external
      # dependency CI doesn't need. This also matches the environment the
      # repo is validated against locally.
      - name: Install linters
        run: pip install ansible ansible-lint yamllint
      - name: Install extra collections (not in the pip bundle)
        run: ansible-galaxy collection install arensb.truenas

      - name: Show tool versions (debugging aid)
        run: |
          yamllint --version
          ansible-lint --version
          shellcheck --version | head -2 || true

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: shellcheck netboot/setup.sh bootstrap/build-iso.sh
