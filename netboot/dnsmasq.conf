# ark-fleet netboot :: dnsmasq as proxyDHCP + TFTP.
# Coexists with your pfSense DHCP — assigns NO IPs, only adds PXE boot info.
# Needs host networking (see docker-compose.yml) to see DHCP broadcasts.

# Not a DNS server.
port=0

# Log every DHCP/PXE exchange (docker compose logs -f dnsmasq) — leave on until
# both Tinys have installed, it's the only way to debug PXE.
log-dhcp

# ProxyDHCP for the LAN. Change to match your subnet if it differs.
dhcp-range=172.27.69.0,proxy

# --- Client architecture detection (UEFI vs legacy BIOS) ---
# option:client-arch  7/9 = x86-64 UEFI, 0 = legacy BIOS
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0

# --- Boot file per architecture (relative to tftp-root) ---
# UEFI -> Debian's signed GRUB netboot (then loads grub/grub.cfg)
dhcp-boot=tag:efi-x86_64,debian-installer/amd64/bootnetx64.efi
# BIOS -> pxelinux
dhcp-boot=tag:bios,pxelinux.0

# --- TFTP ---
enable-tftp
tftp-root=/srv/tftp

# Short prompt so an accidental PXE boot is visible and escapable.
pxe-prompt="ark-fleet netboot",2
