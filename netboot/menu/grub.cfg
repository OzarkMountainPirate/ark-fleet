# ark-fleet UEFI netboot menu. setup.sh substitutes __HTTP_HOST__.
# Reusable: add more menuentry blocks for future OSes/installers.
set timeout=3
set default=0

menuentry "ark-fleet: Debian 13 unattended install" {
    linux  /debian-installer/amd64/linux auto=true priority=critical \
           preseed/url=http://__HTTP_HOST__:__HTTP_PORT__/preseed.cfg vga=788 ---
    initrd /debian-installer/amd64/initrd.gz
}

menuentry "Debian 13 installer (manual)" {
    linux  /debian-installer/amd64/linux ---
    initrd /debian-installer/amd64/initrd.gz
}
