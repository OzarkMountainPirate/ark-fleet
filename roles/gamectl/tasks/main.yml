---
- name: Assert every declared map exists in the port table
  ansible.builtin.assert:
    that: ark_maps | default([]) | difference(ark_port_map.keys() | list) | length == 0
    fail_msg: >-
      Unknown map(s) in ark_maps:
      {{ ark_maps | difference(ark_port_map.keys() | list) | join(', ') }}.
      Valid names: {{ ark_port_map.keys() | list | join(', ') }}.

# --- Rate engine: compute effective multipliers from the master dial ---------
# MUST run before the conf render below — the gamectl.conf template emits
# ARK_EXTRA_QUERY from gamectl_rates. (Learned the hard way: undefined-var
# fatal at render when this sat at the bottom of the role.)
- name: Assert rate overrides only touch known profile keys
  ansible.builtin.assert:
    that: ark_rates.keys() | difference(ark_rate_profile.keys() | list) | length == 0
    fail_msg: >-
      Unknown key(s) in ark_rates:
      {{ ark_rates.keys() | difference(ark_rate_profile.keys() | list) | join(', ') }}.
      Keys must exist in ark_rate_profile (silently ignored settings help nobody).

- name: Compute effective rates from the profile curve
  ansible.builtin.set_fact:
    gamectl_rates: >-
      {%- set m = ark_rate_multiplier | float -%}
      {%- set out = {} -%}
      {%- for key, p in ark_rate_profile.items() -%}
        {%- if key in ark_rates -%}
          {%- set _ = out.update({key: {'file': p.file, 'value': ark_rates[key]}}) -%}
        {%- elif m > 1 -%}
          {%- if p.mode == 'linear' -%}
            {%- set _ = out.update({key: {'file': p.file, 'value': [m, p.cap | float] | min}}) -%}
          {%- elif p.mode == 'inverse' -%}
            {%- set _ = out.update({key: {'file': p.file, 'value': [1 / m, p.floor | float] | max | round(4)}}) -%}
          {%- elif p.mode == 'boost' -%}
            {%- set _ = out.update({key: {'file': p.file, 'value': p.value}}) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Deploy gamectl from upstream at the pinned ref
  ansible.builtin.get_url:
    url: "{{ gamectl_repo_raw }}/{{ gamectl_version }}/{{ gamectl_path }}"
    dest: /usr/local/bin/gamectl
    mode: "0755"
    force: true                        # re-check upstream each run; changed only on diff
    checksum: "{{ ('sha256:' + gamectl_checksum) if gamectl_checksum | length > 0 else omit }}"

# --- Reconcile: retire instances on disk that are no longer declared --------
# MUST run BEFORE the conf render: gamectl backup resolves instances from the
# conf on disk, so the retiring instance has to still be listed when its
# save-safe archive is taken. (Learned the hard way: rc=2, data retained.)
- name: Find existing instances
  ansible.builtin.find:
    paths: "{{ ark_root }}/instances"
    file_type: directory
    recurse: false
  register: gamectl_existing

- name: Compute retired instances (on disk but not declared)
  ansible.builtin.set_fact:
    gamectl_retired: >-
      {{ gamectl_existing.files | map(attribute='path') | map('basename')
         | difference(ark_maps | map('lower') | list) }}

- name: Retire undeclared instances (backup -> stop -> disable -> remove)
  ansible.builtin.include_tasks: retire.yml
  loop: "{{ gamectl_retired }}"
  loop_control:
    loop_var: retired_instance

- name: Render /etc/gamectl.conf
  ansible.builtin.template:
    src: gamectl.conf.j2
    dest: /etc/gamectl.conf
    owner: root
    group: root
    mode: "0640"                       # contains ADMIN_PASSWORD
  notify:
    - Sync instances
    - Restart instances

# --- First install: creates arkserver user, /opt/ark tree, downloads the
#     ~14GB server template. Guarded so it only runs once. ---
- name: Check for existing server template
  ansible.builtin.stat:
    path: "{{ ark_root }}/template/ShooterGame/Binaries/Linux/ShooterGameServer"
  register: gamectl_template

- name: Run gamectl install (downloads server; long-running, first run only)
  ansible.builtin.command: gamectl install
  when: not gamectl_template.stat.exists
  async: "{{ gamectl_install_timeout }}"
  poll: 30
  changed_when: true

# --- Branch reconciliation --------------------------------------------------
# The install task above is guarded by the template existing, so on an already
# built host it SKIPS — which means changing ark_branch would render a new
# ARK_BRANCH into gamectl.conf and then never actually re-download anything.
# The servers would keep running the old branch while the config claimed
# otherwise, and clients on the declared branch would find them HIDDEN.
# A marker file records the branch the template was actually built from; when
# it disagrees with the declaration, apply it (stop -> update -> sync). The
# "Enable + start" task below brings the instances back up.
- name: Read the branch the template was built from
  ansible.builtin.slurp:
    src: "{{ ark_root }}/.deployed_branch"
  register: gamectl_deployed_branch
  failed_when: false

- name: Detect branch drift
  ansible.builtin.set_fact:
    gamectl_branch_changed: >-
      {{ (gamectl_deployed_branch.content | default('') | b64decode | trim)
         != (ark_branch | default('') | trim) }}

- name: Apply branch change
  when:
    - gamectl_template.stat.exists
    - gamectl_branch_changed | bool
  block:
    - name: "Branch change: stop instances"
      ansible.builtin.command: gamectl stop all
      changed_when: true

    - name: "Branch change: re-download server files on the new branch (long)"
      ansible.builtin.command: gamectl update
      async: "{{ gamectl_install_timeout }}"
      poll: 30
      changed_when: true

    - name: "Branch change: sync new files into instances"
      ansible.builtin.command: gamectl sync all
      changed_when: true

- name: Record the branch the template was built from
  ansible.builtin.copy:
    content: "{{ ark_branch | default('') }}\n"
    dest: "{{ ark_root }}/.deployed_branch"
    mode: "0644"
  when: gamectl_template.stat.exists or not ansible_check_mode

# --- Workshop mods: pre-install into the template ----------------------------
# The engine's -automanagedmods SEGVs on modern Linux (waitid EINVAL), so
# gamectl downloads/extracts mods itself. Idempotent: already-installed mods
# are skipped; 'installed' in the output marks real work and triggers
# sync + restart via handlers. Downloads can be large (Primal Fear is GBs).
- name: Install workshop mods (long on first run)
  ansible.builtin.command: gamectl mods
  register: gamectl_mods_out
  changed_when: "'installed' in gamectl_mods_out.stdout"
  async: 7200
  poll: 30
  notify:
    - Sync instances
    - Restart instances

# --- Reconcile cluster mountpoint ownership now that arkserver exists ---
- name: Fix cluster dir ownership (post-install)
  ansible.builtin.file:
    path: "{{ ark_root }}/cluster"
    state: directory
    owner: "{{ ark_user }}"
    group: "{{ ark_user }}"
  when: cluster_nfs_enabled | bool
  failed_when: false

# --- Create each instance defined for this host, then enable + start it ---
- name: Create instances from template
  ansible.builtin.command: "gamectl create {{ item | lower }}"
  args:
    creates: "{{ ark_root }}/instances/{{ item | lower }}/ShooterGame/Binaries/Linux/ShooterGameServer"
  loop: "{{ ark_maps }}"

- name: Template Game.ini for each instance
  ansible.builtin.template:
    src: Game.ini.j2
    dest: "{{ ark_root }}/instances/{{ item | lower }}/ShooterGame/Saved/Config/LinuxServer/Game.ini"
    owner: "{{ ark_user }}"
    group: "{{ ark_user }}"
    mode: "0644"
  loop: "{{ ark_maps }}"
  notify: Restart instances

- name: Enable + start ark@<instance> units
  ansible.builtin.systemd:
    name: "ark@{{ item | lower }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ ark_maps }}"
