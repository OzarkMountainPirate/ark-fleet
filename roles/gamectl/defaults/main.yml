---
# gamectl install downloads ~14GB; give it room.
gamectl_install_timeout: 3600

# Where gamectl comes from: its upstream repo, at a PINNED ref. Updates land
# in the upstream repo once (single source of truth); deploying them here is
# a deliberate one-line pin bump (reproducibility). Use a tag or commit SHA —
# "main" works but makes deploys non-reproducible; pin for real use.
gamectl_repo_raw: "https://raw.githubusercontent.com/OzarkMountainPirate/utilities"
gamectl_version: "v1.6.4"
gamectl_path: "bash-scripts/ark-ase/gamectl"
# Optional but recommended with a pin: sha256 of the pinned file.
#   curl -sL <raw-url-at-pin> | sha256sum
gamectl_checksum: "e2239336c1e389d2ef0dfb26161bdb7c3afc89c6bfd1dd94cd8fa324f47c650e"

# Scale-down behavior; see group_vars. Backup always runs first regardless.
ark_retire_removes_data: true

# Steam beta branch for the server files (empty = live). See group_vars.
ark_branch: ""

# --- Boosted-server rate engine ----------------------------------------------
# ark_rate_multiplier is the master dial (1 = vanilla). Each knob follows the
# profile below rather than the raw number, because a literal 1000x-everything
# server is unplayable: interval-type settings INVERT (lower = faster), and
# several knobs break past their caps (loot quality >5 corrupts items; babies
# maturing >~100x finish before a single imprint cuddle is possible).
# Modes: linear  -> min(M, cap)          (higher = faster/more)
#        inverse -> max(1/M, floor)      (lower  = faster)
#        boost   -> fixed value once M > 1 (thresholds like difficulty)
# ark_rates overrides any profile key with an explicit value (unknown keys
# fail fast rather than silently doing nothing). At M == 1 with no overrides,
# nothing is emitted at all -- a true vanilla server.
ark_rate_multiplier: 1
ark_rates: {}
ark_rate_profile:
  # GameUserSettings-class -> passed as ?Key=Value launch options (override
  # the INI, immune to ARK rewriting GameUserSettings.ini on shutdown)
  XPMultiplier:                        {file: query, mode: linear, cap: 1000}
  TamingSpeedMultiplier:               {file: query, mode: linear, cap: 1000}
  HarvestAmountMultiplier:             {file: query, mode: linear, cap: 500}
  ItemStackSizeMultiplier:             {file: query, mode: linear, cap: 50}
  CropGrowthSpeedMultiplier:           {file: query, mode: linear, cap: 100}
  ResourcesRespawnPeriodMultiplier:    {file: query, mode: inverse, floor: 0.1}
  PlayerCharacterFoodDrainMultiplier:  {file: query, mode: inverse, floor: 0.5}
  PlayerCharacterWaterDrainMultiplier: {file: query, mode: inverse, floor: 0.5}
  DifficultyOffset:                    {file: query, mode: boost, value: 1.0}
  OverrideOfficialDifficulty:          {file: query, mode: boost, value: 5.0}
  # Game.ini-class -> templated into each instance's Game.ini
  MatingIntervalMultiplier:            {file: game, mode: inverse, floor: 0.01}
  MatingSpeedMultiplier:               {file: game, mode: linear, cap: 100}
  LayEggIntervalMultiplier:            {file: game, mode: inverse, floor: 0.01}
  EggHatchSpeedMultiplier:             {file: game, mode: linear, cap: 300}
  BabyMatureSpeedMultiplier:           {file: game, mode: linear, cap: 100}
  BabyCuddleIntervalMultiplier:        {file: game, mode: inverse, floor: 0.01}
  BabyImprintAmountMultiplier:         {file: game, mode: linear, cap: 100}
  BabyFoodConsumptionSpeedMultiplier:  {file: game, mode: inverse, floor: 0.3}
  SupplyCrateLootQualityMultiplier:    {file: game, mode: linear, cap: 5}
  FishingLootQualityMultiplier:        {file: game, mode: linear, cap: 5}

# --- Level caps ---------------------------------------------------------------
# 0 = leave ARK's defaults alone (player 105, tamed dino 88 gains).
# Raising these regenerates the XP ramps and the per-level engram lines in
# Game.ini. Budget HEADROOM: ascension (+15) and chibi levels stack ON TOP of
# the cap, so a "190" server usually declares ~205 to leave room.
# NOTE: these do NOT affect WILD dino levels. Wild max = OverrideOfficialDifficulty
# x 30, set via ark_rates (e.g. OverrideOfficialDifficulty: 10.0 -> wild 300).
ark_player_max_level: 0
ark_dino_max_level: 0
# Cumulative XP for level n is ark_level_xp_step * n^2. On a boosted server the
# curve shape barely matters; monotonicity is what ARK requires.
ark_level_xp_step: 500        # cumulative XP for level n = step * n^2
# Engram points granted per level above 1.
ark_level_engram_points: 25   # engram points granted per level above 1
