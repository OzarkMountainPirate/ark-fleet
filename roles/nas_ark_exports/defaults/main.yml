---
# TrueNAS-side provisioning for the ARK cluster. Overrides live in
# group_vars/all/main.yml (nas_* section).
nas_pool: Pool1
nas_ark_parent: ark
# NAS-local identity that ALL client NFS access is squashed to (mapall).
# Needed because arkserver on each game host has a different dynamic UID.
nas_ark_user: arknfs
nas_ark_group: arknfs
# Restrict exports to the LAN.
nas_export_networks:
  - 192.168.1.0/24
