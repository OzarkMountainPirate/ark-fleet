---
# Provision the ARK datasets + NFS exports on TrueNAS via the middleware
# (arensb.truenas drives midclt over SSH). Connect as root with SSH enabled
# on the NAS — a one-time UI bootstrap, like the preseed SSH key.

- name: Create NAS-side squash group
  arensb.truenas.group:
    name: "{{ nas_ark_group }}"
    state: present

- name: Create NAS-side squash user (all NFS client access maps to this)
  arensb.truenas.user:
    name: "{{ nas_ark_user }}"
    comment: "ARK NFS squash identity (managed by ark-fleet)"
    group: "{{ nas_ark_group }}"
    password_disabled: true
    # SMB users may not have password auth disabled (TrueNAS 25.x middleware
    # rule); this identity exists only as an NFS mapall target anyway.
    smb: false
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_group: false
    state: present

- name: Create ARK datasets
  arensb.truenas.filesystem:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ nas_pool }}/{{ nas_ark_parent }}"
    - "{{ nas_pool }}/{{ nas_ark_parent }}/cluster"
    - "{{ nas_pool }}/{{ nas_ark_parent }}/backups"

- name: Ensure NFS service is enabled and running
  arensb.truenas.service:
    name: nfs
    enabled: true
    state: started

- name: Export cluster dataset (squashed, LAN-only)
  arensb.truenas.sharing_nfs:
    name: "ark cluster transfer dir (managed by ark-fleet)"
    path: "/mnt/{{ nas_pool }}/{{ nas_ark_parent }}/cluster"
    mapall_user: "{{ nas_ark_user }}"
    mapall_group: "{{ nas_ark_group }}"
    networks: "{{ nas_export_networks }}"
    enabled: true
    state: present

- name: Export backups dataset (squashed, LAN-only)
  arensb.truenas.sharing_nfs:
    name: "ark backups (managed by ark-fleet)"
    path: "/mnt/{{ nas_pool }}/{{ nas_ark_parent }}/backups"
    mapall_user: "{{ nas_ark_user }}"
    mapall_group: "{{ nas_ark_group }}"
    networks: "{{ nas_export_networks }}"
    enabled: true
    state: present
