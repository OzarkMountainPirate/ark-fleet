---
# ============================================================================
# COPY ME:  cp group_vars/all.example.yml group_vars/all/main.yml   (gitignored)
# (must live INSIDE group_vars/all/ — files there load for every host)
# Fleet-wide settings. Non-secret. Secrets live in group_vars/vault.yml
# (ansible-vault) and are referenced here as vault_* .
# ============================================================================

# --- ARK / gamectl identity (shared across the cluster) ---------------------
ark_root:        "/opt/ark"
ark_user:        "arkserver"
cluster_id:      "my-cluster"           # same on both hosts = transfers work
ark_appid:       "376030"               # ASE dedicated server
# Steam Workshop mod IDs (applies to every instance; server restart required
# for changes to take effect: ansible ark_fleet -a "gamectl restart all")
mods: []
backup_keep_days: "14"

# admin/RCON password pulled from the vault (see vault.example.yml)
admin_password:  "{{ vault_admin_password }}"

# --- Static networking (optional) --------------------------------------------
# Pins each host's IP from the inventory (static_net_ip defaults to that
# host's ansible_host), eliminating DHCP-reservation dependence. Written by
# the static_net role; applied by an end-of-play reboot. First run against a
# freshly installed DHCP host:
#   ansible-playbook site.yml -l acheron -e ansible_host=<current-dhcp-ip>
static_net_enabled: true
static_net_prefix: 24
static_net_gateway: 192.168.1.1
static_net_dns:
  - 192.168.1.1
static_net_search: lan.example.com

# --- Dedicated data disk (optional) ------------------------------------------
# Mounts a second disk at /opt so the ~40GB+ of ARK files (template, instances,
# saves, local backups under /opt/ark) never fill the system disk. Example:
# 256GB NVMe system disk + 500GB HDD data disk. The role refuses to touch the
# disk backing / and never reformats an existing filesystem.
data_disk_enabled: true
data_disk_device: /dev/sda         # the HDD (NVMe system disk is nvme0n1)
data_disk_mount: /opt
data_disk_fstype: ext4
data_disk_label: arkdata
data_disk_mount_opts: defaults,noatime

# --- Shared cluster directory over NFS (the load-bearing bit) ---------------
# ARK stores cross-server transfer data in ARK_ROOT/cluster. On a multi-HOST
# cluster that dir MUST be shared, or uploads on one map never appear on the
# other. Served from your NAS / NFS server.
#
# PHASE ONE: off. Each host runs with a LOCAL cluster dir — both servers are
# fully playable immediately; only cross-HOST character/creature transfers wait.
# Flip to true (and set the export below) once the TrueNAS dataset exists, then
# re-run: ansible-playbook site.yml --tags cluster,gamectl
cluster_nfs_enabled: false
cluster_nfs_server:  "192.168.1.15"                 # TrueNAS
cluster_nfs_export:  "/mnt/tank/ark/cluster"        # dataset exported to the Tinys
cluster_nfs_opts:    "rw,hard,noatime,vers=4"

# --- Backups: push save archives off-box to TrueNAS -------------------------
# PHASE ONE: local backups only. The timer still runs save-safe gamectl backup
# into /opt/ark/bak; flip this true once TrueNAS is ready to also rsync off-box.
backup_push_enabled: false
backup_nfs_server:   "192.168.1.15"                 # the NAS
backup_nfs_export:   "/mnt/tank/ark/backups"
backup_nfs_mount:    /mnt/ark-backups
# automount: attaches on access, detaches when idle — a down NAS fails the
# backup unit cleanly instead of hanging rsync (see ark_backup defaults).
backup_nfs_opts:     "rw,hard,noatime,vers=4,x-systemd.automount,x-systemd.idle-timeout=600"
backup_on_calendar:  "*-*-* 04:30:00"               # systemd OnCalendar, per host

# --- Boosted-server rates (the master dial) ----------------------------------
# 1 = vanilla (nothing emitted). 100/300/1000 = a sane boosted server matching
# what advertised NNNx servers actually run: linear knobs follow the dial up
# to per-knob caps, interval knobs INVERT (lower = faster), and thresholds
# like difficulty snap to sane values. The full curve lives in the gamectl
# role defaults (ark_rate_profile). Changes auto-apply: conf + Game.ini
# re-render, start scripts regenerate, instances restart.
ark_rate_multiplier: 1

# Per-knob overrides (win over the dial; keys must exist in the profile):
#   OverrideOfficialDifficulty: 10.0    # wild level 300 instead of 150
#   BabyMatureSpeedMultiplier: 50       # slower babies, more imprint window
# After changing difficulty, run once per map so wild dinos respawn at the
# new levels:  gamectl rcon <instance> "DestroyWildDinos"
ark_rates: {}

# --- Level caps ----------------------------------------------------------------
# 0 = ARK defaults (player 105). Raising these regenerates the XP ramps and the
# per-level engram lines in Game.ini -- a few hundred lines, generated, never
# hand-edited. Leave HEADROOM: ascension (+15) and chibi levels stack on top of
# the cap, so a "190" server usually declares ~205.
# These do NOT affect WILD dino levels: wild max = OverrideOfficialDifficulty x 30,
# set via ark_rates (e.g. OverrideOfficialDifficulty: 10.0 -> wild 300).
ark_player_max_level: 0
ark_dino_max_level: 0
# ark_level_xp_step / ark_level_engram_points tune the curve and engram grant;
# see roles/gamectl/defaults/main.yml for defaults.

# --- Weekly maintenance (ark_update) -----------------------------------------
# Sunday window: RCON countdown broadcasts, gamectl update (branch-pinned),
# OS full-upgrade, reboot only if the OS requires it. Orders itself after the
# backup service, so Sunday archives land before the world stops.
update_enabled: true
update_on_calendar: "Sun *-*-* 04:30:00"
update_warn_minutes: [15, 5, 1]
update_warn_message: "SERVER MAINTENANCE in {m} minute(s): world save + patching. Back shortly!"
update_reboot: true

# --- Base hardening ---------------------------------------------------------
manage_firewall: true
timezone: "America/Chicago"

# --- Canonical per-map ports (community-standard scheme) ----------------------
# Ports are a function of the map — hosts just declare ark_maps in the
# inventory and everything (gamectl.conf, ufw, units, backups) derives from
# this table. Raw port is always game+1.
ark_port_map:
  TheIsland:     {game: 7777, query: 27051, rcon: 27151}
  ScorchedEarth: {game: 7779, query: 27052, rcon: 27152}
  Aberration:    {game: 7781, query: 27053, rcon: 27153}
  Extinction:    {game: 7783, query: 27054, rcon: 27154}
  Genesis1:      {game: 7785, query: 27055, rcon: 27155}
  Genesis2:      {game: 7787, query: 27056, rcon: 27156}
  TheCenter:     {game: 7789, query: 27057, rcon: 27157}
  Ragnarok:      {game: 7791, query: 27058, rcon: 27158}
  Valguero:      {game: 7793, query: 27059, rcon: 27159}
  CrystalIsles:  {game: 7795, query: 27060, rcon: 27160}
  LostIsland:    {game: 7797, query: 27061, rcon: 27161}
  Fjordur:       {game: 7799, query: 27062, rcon: 27162}

# Scale-down safety: undeclared instances found on a host are retired by the
# play — save-safe gamectl backup FIRST, then stop/disable, then (only if the
# backup succeeded and this is true) the instance directory is removed.
ark_retire_removes_data: true

# --- gamectl source pin -------------------------------------------------------
# gamectl deploys from its upstream repo at this ref. Bump deliberately;
# a tag or commit SHA keeps deploys reproducible. Optional sha256 pin:
#   curl -sL <raw-url-at-ref> | sha256sum
gamectl_version: "v1.6.3"        # e.g. "v1.1" or a full commit SHA
gamectl_checksum: ""

# Steam beta branch for the ARK server (empty = live/default). Example:
# "preaquatica" pins servers to the pre-Aquatica release (358.x) — required
# when players run the preaquatica or linuxnative client branches; live-branch
# (360.x) servers are silently HIDDEN from those clients. Client and server
# major versions must match. Changing this triggers a full rollback download
# on the next gamectl install/update.
ark_branch: ""

# --- NAS provisioning (the 'nas' play; TrueNAS via arensb.truenas) -----------
nas_pool: tank
nas_ark_parent: ark
nas_ark_user: arknfs          # all client NFS access squashed to this identity
nas_ark_group: arknfs
nas_export_networks:
  - 192.168.1.0/24
